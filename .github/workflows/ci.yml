name: Verificar proposta

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configurar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Definir caminho base
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          CUSTOM_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: |
          if [ -n "$CUSTOM_BASE_PATH" ]; then
            echo "VITE_BASE_PATH=$CUSTOM_BASE_PATH" >> "$GITHUB_ENV"
          elif [[ "$REPO_NAME" == *.github.io ]]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/$REPO_NAME/" >> "$GITHUB_ENV"
          fi
      - name: Verificar projeto
        run: npm run check
      - name: Gerar site
        run: npm run build
      - name: Conferir tamanho
        run: npm run size
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Testar no navegador
        run: npm run e2e
